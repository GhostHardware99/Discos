/* ===== Ajustes: lista agrupada ===== */
.cfg-h{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:22px 6px 8px}
.cfg-g{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.cfg-i{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:0;background:none;padding:12px 14px;text-align:left;font-size:15px;color:var(--tx);cursor:pointer}
.cfg-i+.cfg-i{border-top:1px solid var(--bd)}
.cfg-i:active{background:var(--gl)}
.cfg-ic{width:30px;height:30px;border-radius:9px;background:var(--ac2);color:var(--act);display:flex;align-items:center;justify-content:center;flex:none}
.cfg-ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cfg-t{flex:1;min-width:0;font-weight:600}
.cfg-v{color:var(--mut);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}

.cfg-i.dn{color:#ef4444}
.cfg-i.dn .cfg-ic{background:rgba(239,68,68,.14);color:#ef4444}

#st{margin-bottom:4px}

/* ===== Colección a pantalla completa, menú y editor de foto ===== */
.ccv{width:min(66vw,270px);aspect-ratio:1;margin:4px auto 0;border-radius:16px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.35);background:var(--ac2)}
.ccv .mos{border-radius:0;height:100%;aspect-ratio:auto;gap:2px}
.ccv .mos .cv{font-size:26px}
.cmenu{position:fixed;z-index:30;right:14px;top:calc(66px + var(--sat));min-width:220px;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.3);padding:6px}
.cmenu button{display:block;width:100%;border:0;background:none;padding:13px 12px;border-radius:10px;text-align:left;font-size:15px;font-weight:600}
.cmenu button:active{background:var(--ac2)}
.cmenu button.dg{color:#d6336c}
.cedw{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.cedb{background:var(--bg);border-radius:22px;padding:18px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;align-items:center}
.cedt{font-weight:800;font-size:17px}
.cedv{position:relative;overflow:hidden;border-radius:18px;touch-action:none;background:#000}
.cedv img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.cedh{font-size:12.5px;color:var(--mut);text-align:center}
.cedr{width:100%;padding:0}
.cedb .row{width:100%;flex-wrap:nowrap}

/* ===== Pulsación larga, editar colección, carpeta nueva, teclado ===== */
body.kbd #nav{display:none}
#toast{z-index:90}
/* Selección múltiple */
body.msel #list [data-k],body.msel #cpl [data-k]{position:relative;-webkit-user-select:none;user-select:none}
body.msel #list [data-k]::after,body.msel #cpl [data-k]::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(0,0,0,.35);box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--onac);line-height:20px;text-align:center}
body.msel #list .tl[data-k]::after,body.msel #cpl .tl[data-k]::after{top:6px;right:6px}
body.msel #list .li[data-k]::after,body.msel #cpl .li[data-k]::after{right:6px;top:50%;margin-top:-12px}
body.msel #list [data-k].msx::after,body.msel #cpl [data-k].msx::after{content:"✓";background:var(--ac);border-color:var(--ac)}
body.msel #list .tl.msx .cv,body.msel #cpl .tl.msx .cv{box-shadow:0 0 0 3px var(--ac)}

#msb{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;max-width:876px;margin:auto;background:var(--navbg);border:1px solid var(--glb);border-radius:22px;padding:10px;box-shadow:0 8px 30px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:lpin .16s ease-out}

html{overflow-x:hidden}

<script>
/* Nada de menú del navegador (copiar/descargar imagen, abrir en Chrome, etc.) al dejar presionado; solo en cajas de texto */
(function(){function tf(t){return !!(t&&t.closest&&t.closest('input,textarea,[contenteditable="true"]'))}
document.addEventListener('contextmenu',function(e){if(!tf(e.target))e.preventDefault()});
document.addEventListener('dragstart',function(e){if(!tf(e.target))e.preventDefault()});
document.addEventListener('selectstart',function(e){var t=e.target&&e.target.nodeType==1?e.target:(e.target&&e.target.parentElement);if(!tf(t))e.preventDefault()})})();
</script>
